name: Build PvG3 (Windows x64)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Standalone Windows EXE
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Write Firebase configuration from repository secrets
        if: ${{ secrets.PVG3_DATABASE_HOST != '' || secrets.PVG3_DATABASE_AUTH != '' }}
        env:
          PVG3_DATABASE_HOST: ${{ secrets.PVG3_DATABASE_HOST }}
          PVG3_DATABASE_AUTH: ${{ secrets.PVG3_DATABASE_AUTH }}
        run: sh tools/write_online_config.sh
        shell: bash

      - name: Install Clang, ccache and MinGW-w64 link libraries
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: >-
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-lld
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-winpthreads
            mingw-w64-ucrt-x86_64-ccache

      - name: Record Windows Clang version
        id: windows-toolchain
        shell: msys2 {0}
        run: |
          set -euo pipefail
          COMPILER_VERSION="$(clang --version | head -n 1)"
          COMPILER_HASH="$(printf '%s' "$COMPILER_VERSION" | sha256sum | cut -d' ' -f1)"
          OUTPUT_FILE="$(cygpath -u "$GITHUB_OUTPUT")"
          echo "compiler=$COMPILER_HASH" >> "$OUTPUT_FILE"
          echo "Clang=$COMPILER_VERSION"

      - name: Restore Windows compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/build/windows/ccache
          key: pvg3-windows-ccache-v1-${{ runner.os }}-${{ steps.windows-toolchain.outputs.compiler }}-${{ hashFiles('.github/workflows/Windows.yml', 'src/**/*.c', 'src/**/*.h') }}
          restore-keys: |
            pvg3-windows-ccache-v1-${{ runner.os }}-

      - name: Compile Win32 host and WinHTTP adapter with Clang
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p build/windows
          export CCACHE_DIR="$(cygpath -w "$PWD/build/windows/ccache")"
          export CCACHE_COMPILERCHECK='%compiler% --version'
          export CCACHE_MAXSIZE=1G
          ccache --max-size=1G
          clang --version
          COMMON='-std=c11 -O2 -Wall -Wextra -Werror -pthread -finput-charset=UTF-8 -fexec-charset=UTF-8 -Isrc -Isrc/vendor/lvgl'
          compile_checked() {
            local log_file="$1"
            shift
            if "$@" >"$log_file" 2>&1; then
              cat "$log_file"
              return 0
            fi
            echo "Compiler diagnostics ($log_file):"
            while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              line="${line//$'\r'/'%0D'}"
              printf '::error::%s\n' "$line"
            done < "$log_file"
            return 1
          }
          compile_checked build/windows/windows_main.log ccache clang $COMMON \
            -c src/windows_main.c -o build/windows/windows_main.o
          compile_checked build/windows/windows_online_http.log ccache clang $COMMON \
            -c src/windows_online_http.c -o build/windows/windows_online_http.o
          compile_checked build/windows/online_net.log ccache clang $COMMON \
            -c src/online_net.c -o build/windows/online_net.o
          compile_checked build/windows/lvgl_ui.log ccache clang $COMMON \
            -c src/lvgl_ui.c -o build/windows/lvgl_ui.o

      - name: Link standalone GUI executable
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export CCACHE_DIR="$(cygpath -w "$PWD/build/windows/ccache")"
          export CCACHE_COMPILERCHECK='%compiler% --version'
          export CCACHE_MAXSIZE=1G
          mapfile -t LVGL_SOURCES < <(find src/vendor/lvgl/src -name '*.c' | LC_ALL=C sort)
          SOURCES=(
            src/game.c src/font.c src/preferences.c src/online_rules.c src/online_protocol.c
            "${LVGL_SOURCES[@]}"
          )
          CFLAGS=(-std=c11 -O2 -pthread -finput-charset=UTF-8 -fexec-charset=UTF-8
                  -Isrc -Isrc/vendor/lvgl)
          OBJECTS=(
            build/windows/windows_main.o
            build/windows/windows_online_http.o
            build/windows/online_net.o
            build/windows/lvgl_ui.o
          )
          mkdir -p build/windows/objects
          for index in "${!SOURCES[@]}"; do
            object="build/windows/objects/$index.o"
            ccache clang "${CFLAGS[@]}" -c "${SOURCES[$index]}" -o "$object"
            OBJECTS+=("$object")
          done
          if ! clang -std=c11 -O2 -mwindows -static -pthread -fuse-ld=lld \
            -finput-charset=UTF-8 -fexec-charset=UTF-8 \
            -Isrc -Isrc/vendor/lvgl \
            "${OBJECTS[@]}" \
            -lwinhttp -lbcrypt -lgdi32 -lwinmm -luser32 -lm \
            -o build/windows/PvG3.exe > build/windows/link.log 2>&1; then
            tail -n 80 build/windows/link.log | sed 's/%/%25/g' | while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done
            exit 1
          fi
          cat build/windows/link.log
          test -s build/windows/PvG3.exe
          objdump -f build/windows/PvG3.exe | grep 'pei-x86-64'
          ccache --show-stats

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v7
        with:
          name: PvG3-Windows-x64
          path: build/windows/PvG3.exe
          if-no-files-found: error
