name: Build PvG3 (Windows x64)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Standalone Windows EXE
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-winpthreads

      - name: Compile Win32 host and WinHTTP adapter with strict warnings
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p build/windows
          COMMON='-std=c11 -O2 -Wall -Wextra -Werror -pthread -finput-charset=UTF-8 -fexec-charset=UTF-8 -Isrc -Isrc/vendor/lvgl'
          compile_checked() {
            local log_file="$1"
            shift
            if "$@" >"$log_file" 2>&1; then
              cat "$log_file"
              return 0
            fi
            echo "Compiler diagnostics ($log_file):"
            while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              line="${line//$'\r'/'%0D'}"
              printf '::error::%s\n' "$line"
            done < "$log_file"
            return 1
          }
          compile_checked build/windows/windows_main.log gcc $COMMON \
            -c src/windows_main.c -o build/windows/windows_main.o
          compile_checked build/windows/windows_online_http.log gcc $COMMON \
            -c src/windows_online_http.c -o build/windows/windows_online_http.o
          compile_checked build/windows/online_net.log gcc $COMMON \
            -c src/online_net.c -o build/windows/online_net.o
          compile_checked build/windows/lvgl_ui.log gcc $COMMON \
            -c src/lvgl_ui.c -o build/windows/lvgl_ui.o

      - name: Link standalone GUI executable
        shell: msys2 {0}
        run: |
          set -euo pipefail
          LVGL_SOURCES="$(find src/vendor/lvgl/src -name '*.c' | LC_ALL=C sort)"
          gcc -std=c11 -O2 -mwindows -static -pthread \
            -finput-charset=UTF-8 -fexec-charset=UTF-8 \
            -Isrc -Isrc/vendor/lvgl \
            src/game.c src/font.c src/lvgl_ui.c src/online_rules.c \
            src/online_protocol.c src/online_net.c src/windows_online_http.c \
            src/windows_main.c $LVGL_SOURCES \
            -lwinhttp -lbcrypt -lgdi32 -lwinmm -luser32 -lm \
            -o build/windows/PvG3.exe
          test -s build/windows/PvG3.exe
          objdump -f build/windows/PvG3.exe | grep 'pei-x86-64'

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: PvG3-Windows-x64
          path: build/windows/PvG3.exe
          if-no-files-found: error
